MODEL:
  NAME: 'ViT-B-16'
  STRIDE_SIZE: [16, 16] # patch步长
  MEMORY_MOMENTUM: 0.2 # 记忆更新动量
  ID_LOSS_WEIGHT: 0.25
  PCL_LOSS_WEIGHT: 1.0 # 记忆对比损失
  
  MAMBA_PCL_LOSS_WEIGHT: 0.1 # Ablation B: Mamba分支memory/prototype对比损失权重，0表示关闭
  
  USE_ATTENTION_REORDER: True  # base 使用CLIP最后一层attention指导patch重排序
  MAMBA_TOP_K: 128            # 只取Top-K个patch进入Mamba（<=128）
  
  ATTENTION_REORDER_SOFT_GATE: False  # Ablation A: attention排序token与原始顺序token做soft gate残差融合
  ATTENTION_GATE_TEMPERATURE: 0.1    # gate温度，越小越接近hard选择
  ATTENTION_GATE_CENTER: 0.5         # 归一化attention超过该值时更偏向reorder token
  
  USE_LOCAL_CLIP_AGG: False           # Ablation C: 局部CLIP聚合：用水平stripe的patch特征补充CLS
  LOCAL_CLIP_NUM_STRIPES: 4          # 将patch网格按高度划分的局部条带数
  LOCAL_CLIP_FUSION_ALPHA: 0.5       # CLS与局部聚合特征融合比例
  LOCAL_CLIP_USE_VISIBILITY: False    # 局部聚合时使用可见性分数重加权patch
  
  USE_VISIBILITY_WEIGHTING: False     # Mamba最终token attention使用可见性分数重加权
  VISIBILITY_TEMPERATURE: 0.2        # 可见性sigmoid温度
  VISIBILITY_CENTER: 0.5             # 可见性sigmoid中心
  # SIE_CAMERA: True
  # SIE_COE : 1.0

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5 # random horizontal flip
  RE_PROB: 0.5 # random erasing
  PADDING: 10 # 随机裁剪前 pad 像素
  PIXEL_MEAN: [0.5, 0.5, 0.5] # 归一化均值
  PIXEL_STD: [0.5, 0.5, 0.5] # 归一化方差
 
DATALOADER:
  NUM_INSTANCE: 8 # 每个 identity 在一个 batch 里采样的实例数（PK 采样里的 K）
  NUM_WORKERS: 0

SOLVER:
  IMS_PER_BATCH: 64 # 训练 batch size
  OPTIMIZER_NAME: "SGD" # 优化器
  BASE_LR: 3.5e-4
  # WARMUP_METHOD/ITERS/FACTOR：warmup 策略、步数、倍率
  WARMUP_METHOD: 'linear'
  WARMUP_ITERS: 10
  WARMUP_FACTOR: 0.1
  WEIGHT_DECAY: 5.0e-4
  MAX_EPOCHS: 70 # 总轮次
  CHECKPOINT_PERIOD: 60
  LOG_PERIOD: 50
  EVAL_PERIOD: 60
  ITERS: 200 # 每个epoch迭代数（IterLoader 控制）
  
  STEPS: [30, 50] # lr衰减epoch
  GAMMA: 0.1 # 衰减倍率
  
TEST:
  EVAL: True
  EVAL_AFTER_EPOCH: 60 # 从第60轮开始允许评估
  EVAL_UNTIL_EPOCH: 70 # 评估到第70轮；<=0表示不限制结束轮次
  EVAL_EVERY_AFTER: 1  # 在评估窗口内每轮评估；0表示只按SOLVER.EVAL_PERIOD评估
  IMS_PER_BATCH: 256
  RE_RANKING: False

DATASETS:
  NAMES: ('market1501')
  ROOT_DIR: ('/home/cfdeng/projects/CLIMB-ReID/datasets/reid-datasets')
OUTPUT_DIR: './logs'
