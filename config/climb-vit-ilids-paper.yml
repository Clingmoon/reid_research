MODEL:
  NAME: 'ViT-B-16'
  STRIDE_SIZE: [16, 16]
  MEMORY_MOMENTUM: 0.2
  ID_LOSS_WEIGHT: 0.25
  PCL_LOSS_WEIGHT: 1.0
  SIE_CAMERA: True
  SIE_COE: 1.0
  USE_OCCLUSION_MASK: True

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]
  RE_PROB: 0.5
  SEQ_LEN: 8

DATALOADER:
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  IMS_PER_BATCH: 16
  OPTIMIZER_NAME: "Adam"
  BASE_LR: 5.0e-6
  WARMUP_METHOD: 'linear'
  WARMUP_ITERS: 10
  WARMUP_FACTOR: 0.1
  WEIGHT_DECAY: 1.0e-4
  MAX_EPOCHS: 60
  CHECKPOINT_PERIOD: 100
  LOG_PERIOD: 10
  EVAL_START_EPOCH: 1
  EVAL_PERIOD: 10
  ITERS: 200

  STEPS: [30, 50]
  GAMMA: 0.1

TEST:
  EVAL: True
  IMS_PER_BATCH: 30
  RE_RANKING: False
  NECK_FEAT: 'after'
  FEAT_NORM: 'yes'
  VISUALIZE_COMPARISON: False
  VISUALIZE_ONLY: True
  VISUALIZE_NUM_SAMPLES: 15
  VISUALIZE_EPOCHS: []

DATASETS:
  NAMES: ('ilidsvid')
  ROOT_DIR: ('/home/data/users/cfdeng/tdh/datasets/ilids-vid')

OUTPUT_DIR: './logs_ilids'
